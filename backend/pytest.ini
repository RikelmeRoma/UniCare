[pytest]
# Permite rodar `pytest` tanto de backend/ quanto da raiz do repositorio.
# Sem isto, `import app` so resolve quando o CWD e backend/.
pythonpath = .
testpaths = tests
markers =
    rede: teste que fala com a rede (SMTP real). Pulado por padrao.
# A suíte padrão não toca a rede: o teste de SMTP real só roda com
# `pytest -m rede` (e UNICARE_TESTE_SMTP=1). O `-m` do console sobrepoe este.
addopts = -m "not rede"
