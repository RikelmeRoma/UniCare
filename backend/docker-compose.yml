version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: unicare_postgres
    restart: always
    environment:
      POSTGRES_USER: unicare_user
      POSTGRES_PASSWORD: unicare_password123
      POSTGRES_DB: unicare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicare_user -d unicare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: unicare_api
    restart: always
    environment:
      DATABASE_URL: postgresql://unicare_user:unicare_password123@db:5432/unicare_db
      SECRET_KEY: unicare_super_secret_jwt_key_uninassau_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
