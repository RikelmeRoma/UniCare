services:
  db:
    image: postgres:16-alpine
    container_name: unicare_postgres
    restart: always
    environment:
      POSTGRES_USER: unicare_user
      POSTGRES_PASSWORD: unicare_password123
      POSTGRES_DB: unicare_db
      # Força autenticação por senha em vez de `trust`. Não é a causa de falhas de
      # conexão (ver nota na porta 5433 abaixo), apenas não deixa o banco em trust.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Porta pública 5433, e não 5432: esta máquina tem o serviço nativo
      # `postgresql-x64-15` ocupando a 5432, que absorveria as conexões vindas de
      # `localhost` e produziria "password authentication failed" enganoso.
      # O container continua escutando em 5432 internamente.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o banco unicare_test, usado pela suite de testes. Sem isso a suite
      # cairia no banco de desenvolvimento e escreveria dados de teste nele.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unicare_user -d unicare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: unicare_api
    restart: always
    # Injeta o .env (SECRET_KEY, ALGORITHM, ACCESS_TOKEN_EXPIRE_MINUTES). Sem
    # isto, o container usava um literal com a chave padrao do codigo e emitia
    # tokens que o dev local rejeitava — e vice-versa.
    env_file:
      - .env
    environment:
      # Sobrescreve o DATABASE_URL do .env: dentro da rede do Compose o host do
      # banco e `db`, nao `localhost`, e a porta interna e a 5432.
      DATABASE_URL: postgresql+psycopg2://unicare_user:unicare_password123@db:5432/unicare_db
      # Hot-reload ligado por padrão, já que o Compose é o ambiente de
      # desenvolvimento. Em produção, montar com RELOAD=0.
      RELOAD: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Reaproveita o /health, que já executa SELECT 1 real no Postgres.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./app:/app/app
      # Alembic roda no boot do container (docker/entrypoint.sh). Sem montar estes
      # dois, o container usaria as versoes assadas na imagem e ignoraria qualquer
      # migracao nova criada na maquina de desenvolvimento.
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro

volumes:
  postgres_data:
